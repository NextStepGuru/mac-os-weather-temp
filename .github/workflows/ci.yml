name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Run tests (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 swift test --arch x86_64
          else
            swift test --arch arm64
          fi

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Verify architectures
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/WeatherBar"
          lipo -info "$BIN"
          lipo "$BIN" -verify_arch x86_64 arm64
