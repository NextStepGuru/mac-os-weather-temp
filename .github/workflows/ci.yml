name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Verify architectures
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/WeatherBar"
          lipo -info "$BIN"
          lipo "$BIN" -verify_arch x86_64 arm64
