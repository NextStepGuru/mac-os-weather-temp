name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Run tests (arm64)
        run: swift test --arch arm64

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Verify architectures
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/WeatherBar"
          lipo -info "$BIN"
          lipo "$BIN" -verify_arch x86_64 arm64
